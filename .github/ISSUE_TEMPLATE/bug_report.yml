name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package shows the problem?
      options:
        - fovea-viewers (detection and loading)
        - fovea-code
        - fovea-email
        - fovea-excel
        - fovea-feed
        - fovea-html
        - fovea-image
        - fovea-markdown
        - fovea-pdf
        - fovea-powerpoint
        - fovea-table
        - fovea-text
        - fovea-word
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include how the file is passed in (URL, File, Blob or bytes). Attach a small sample file if you can, with any private content removed.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The version of the package, for example 0.1.0.
  - type: input
    id: environment
    attributes:
      label: React version and browser
      description: For example React 19.1, Chrome 130, or WebView2.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal information first.
