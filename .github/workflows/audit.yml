name: Audit

# Checks locked dependencies for known vulnerabilities. Dependency review only covers
# pull requests, so this catches advisories published against dependencies already in use.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths: [package-lock.json]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
